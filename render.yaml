services:
  - type: web
    name: talentmatch-ai-agent
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LLM_PROVIDER
        value: local_mock
      - key: EMBEDDING_PROVIDER
        value: local_dense
